['Propósito',()=>`<section class="scene"><div class="ey">Do propósito à integridade</div><h2>Lutar, Honrar e Orgulhar a Massa — dentro e fora de campo.</h2><p class="lead">O propósito do Atlético não termina quando o jogo acaba. Ele também orienta a forma como trabalhamos, decidimos e nos relacionamos.</p><p class="body">Comprometimento, profissionalismo, lealdade, inovação e respeito à tradição ganham força quando viram comportamento. É dessa conexão entre propósito, valores e escolhas cotidianas que nasce o <strong>Programa ÉTICO</strong>: uma estrutura para proteger pessoas, decisões, a reputação e a história do Galo.</p><div class="grid g5"><article class="card"><b>Comprometimento</b><p>Assumir responsabilidade pelo impacto das nossas atitudes.</p></article><article class="card"><b>Profissionalismo</b><p>Agir com critério, respeito e responsabilidade em cada decisão.</p></article><article class="card"><b>Lealdade</b><p>Colocar o interesse e a integridade do Clube acima de vantagens pessoais.</p></article><article class="card"><b>Inovação</b><p>Evoluir processos e soluções sem abrir mão da ética.</p></article><article class="card"><b>Respeito à tradição</b><p>Proteger a história e a reputação construídas por gerações.</p></article></div><div class="quote">Honrar a camisa também é fazer o certo quando ninguém está olhando.</div></section>`],
['Programa ÉTICO',()=>`<section class="scene"><div class="ey">Como a integridade funciona</div><h2>Integridade é jogo coletivo.</h2><p class="lead">Assim como em um time, o Programa ÉTICO depende de estratégia, funções claras e atuação coordenada.</p><p class="body">Nossa estrutura organiza capacidades em três frentes: <strong>Prevenção</strong>, <strong>Reforço</strong> e <strong>Identificação e Resposta</strong>. Explore o campo e clique nas posições.</p><div class="pitchwrap"><div class="pitchbox"><div class="tabs"><button class="tab on" data-f="all">Todo o campo</button><button class="tab" data-f="resposta">Identificação e Resposta</button><button class="tab" data-f="reforco">Reforço</button><button class="tab" data-f="prevencao">Prevenção</button></div><div class="pitch"><span class="mid"></span><span class="cir"></span>${nodes.map(n=>`<button class="node ${n[7]?'cap':''}" data-n="${n[0]}" style="left:${n[4]}%;top:${n[5]}%">${n[1]}</button>`).join('')}</div></div><aside id="pinfo" class="pinfo"><span class="tag">Prevenção</span><h3>Cultura e Liderança Ética</h3><p>O capitão do nosso jogo: exemplo, coerência e liderança que transformam regras em comportamento.</p></aside></div></section>`],
['Nosso jeito de agir',()=>`<section class="scene"><div class="ey">O que esperamos de quem se relaciona com o Galo</div><h2>Valores aparecem nas escolhas.</h2><p class="lead">Integridade não é apenas conhecer regras. É transformar princípios em comportamento, mesmo quando ninguém está olhando.</p><div class="grid g5">${[['Respeito','Tratar pessoas com dignidade e rejeitar racismo, discriminação, violência e intolerância.'],['Integridade','Fazer o certo sem atalhos, favorecimentos ou vantagens indevidas.'],['Responsabilidade','Cuidar das pessoas, dos espaços, da reputação e do impacto das nossas atitudes.'],['Proteção','Preservar informações, crianças e adolescentes, o futebol e o patrimônio do Clube.'],['Coragem para falar','Quando algo parece errado, buscar orientação ou utilizar os canais adequados.']].map(x=>`<article class="card"><b>${x[0]}</b><p>${x[1]}</p></article>`).join('')}</div><div class="quote">Ética deixa de ser documento quando vira decisão.</div></section>`],
['Na arquibancada',()=>`<section class="scene"><div class="ey">Comportamento no estádio</div><h2>Na arquibancada, respeito também entra em campo.</h2><p class="lead">Torcer intensamente faz parte da nossa história. Violência e desrespeito, não.</p><div class="grid g5">${[['Respeite','Adversários, árbitros, profissionais, outros torcedores e todos que trabalham no evento.'],['Não agrida','Brigas, ameaças, intimidação e qualquer forma de violência não representam os valores do Clube.'],['Não arremesse objetos','Nada deve ser lançado no campo, na área técnica ou em direção a outras pessoas.'],['Não discrimine','Racismo, homofobia, xenofobia e outras manifestações discriminatórias são incompatíveis com o nosso ambiente.'],['Cuide da nossa casa','Preserve o estádio, respeite as orientações de segurança e ajude a construir um ambiente melhor para todos.']].map(x=>`<article class="card"><b>${x[0]}</b><p>${x[1]}</p></article>`).join('')}</div><div class="quote">A paixão pode ser gigante. O respeito precisa ser maior.</div></section>`],
['Apostas e integridade',()=>`<section class="scene"><div class="ey">Cuidados que permanecem</div><h2>A legislação pode mudar. O cuidado não.</h2><p class="lead">Quando falamos de apostas, três riscos merecem atenção permanente: operações ilegais ou irregulares, perda de controle e manipulação do esporte.</p><div class="grid g3"><article class="card"><b>Legalidade</b><p>Não utilize, divulgue ou promova operadores, modalidades ou práticas em desacordo com a legislação vigente. Desconfie de ofertas sem transparência ou origem conhecida.</p></article><article class="card"><b>Vício e perda de controle</b><p>Endividamento, tentativa de recuperar perdas, aumento progressivo das apostas e sofrimento são sinais de alerta. Procurar ajuda é uma atitude responsável.</p></article><article class="card"><b>Integridade esportiva</b><p>Informação privilegiada, combinação de eventos, manipulação de resultados e abordagens suspeitas colocam pessoas, competições e o futebol em risco.</p></article></div><div class="call"><strong>Aposta não deve ser tratada como investimento.</strong> Se o jogo deixa de ser entretenimento e começa a gerar prejuízo, perda de controle ou sofrimento, é hora de interromper e buscar apoio.</div></section>`],
['Salvaguarda',()=>`<section class="scene"><div class="ey">Proteção de crianças e adolescentes</div><h2>Proteger quem está formando seu caminho é responsabilidade de todos.</h2><p class="lead">Crianças, adolescentes e atletas em formação têm direito a um ambiente seguro, respeitoso e livre de abusos.</p><div class="safe">${[['01','Respeito','Escuta e cuidado compatíveis com a etapa de desenvolvimento.'],['02','Ambiente seguro','Convivência livre de abuso, intimidação e violência.'],['03','Contexto adequado','Interações profissionais, transparentes e apropriadas.'],['04','Voz ativa','Crianças, adolescentes e famílias devem poder falar sem medo.'],['05','Comunicação imediata','Suspeitas ou indícios de violação devem ser reportados pelos canais adequados.']].map(x=>`<article class="card"><span class="num">${x[0]}</span><b>${x[1]}</b><p>${x[2]}</p></article>`).join('')}</div></section>`],
['Canal Ético',()=>`<section class="scene"><div class="ey">Quando algo parece errado</div><h2>Reportar é proteger.</h2><p class="lead">O Canal Ético existe para receber relatos, apoiar apurações e permitir que situações de risco ou desconformidade sejam tratadas com critério e confidencialidade.</p><div class="channel"><div class="box"><h3>Canais oficiais</h3><p><a href="https://canaletico.atletico.com.br" target="_blank" rel="noopener">canaletico.atletico.com.br ↗</a></p><p><strong>0800 591 2213</strong> · Código <strong>727</strong></p><p class="body" style="font-size:14px">O relato pode ser identificado ou anônimo. Relatos de boa-fé são protegidos e a retaliação não é tolerada.</p></div><div class="box"><h3>O que acontece depois?</h3><div class="steps">${[['1. Relato','A situação é comunicada.'],['2. Registro','As informações são organizadas.'],['3. Apuração','Os fatos são analisados.'],['4. Resposta','Medidas cabíveis são definidas.']].map(x=>`<div class="step"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}</div></div></div><div class="call">Você não precisa ter uma investigação pronta para relatar uma preocupação. Compartilhe o que sabe com boa-fé e, sempre que possível, forneça fatos, datas e evidências.</div></section>`],
['Desafio ÉTICO',()=>`<section class="scene"><div class="ey">Última etapa</div><h2>Agora é com você.</h2><p class="lead">Responda ao Desafio ÉTICO e conte um pouco sobre a sua percepção da experiência.</p><div class="formnote"><strong>A identificação no formulário é opcional.</strong> Quem optar por informar nome e e-mail poderá seguir as orientações do formulário para eventual emissão e envio de certificado de conclusão.</div><div class="formshell"><div class="formhead"><h3>Desafio ÉTICO · Mini Experiência</h3><p>O formulário está incorporado abaixo para que você conclua a experiência sem sair da página.</p></div><iframe class="frame" title="Desafio ÉTICO — questionário público" src="${FORM}" frameborder="0" marginwidth="0" marginheight="0" allowfullscreen webkitallowfullscreen mozallowfullscreen msallowfullscreen></iframe><div class="fallback"><span>Se o formulário não carregar corretamente, abra-o diretamente.</span><a href="${OPEN}" target="_blank" rel="noopener">Abrir questionário em nova aba ↗</a></div></div></section>`]];
let pos=0,filter='all',selected='cultura';const app=document.getElementById('app'),prev=document.getElementById('prev'),next=document.getElementById('next'),fill=document.getElementById('fill'),chapter=document.getElementById('chapter'),count=document.getElementById('count'),hint=document.getElementById('hint');function bindPitch(){let info=document.getElementById('pinfo');if(!info)return;function apply(){document.querySelectorAll('.node').forEach(el=>{let n=nodes.find(x=>x[0]===el.dataset.n);el.classList.toggle('dim',filter!=='all'&&n[3]!==filter);el.classList.toggle('sel',n[0]===selected)});document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on',el.dataset.f===filter));let n=nodes.find(x=>x[0]===selected)||nodes[nodes.length-1],g=n[3]==='resposta'?'Identificação e Resposta':n[3]==='reforco'?'Reforço':'Prevenção';info.innerHTML=`<span class="tag">${g}</span><h3>${n[2]}</h3><p>${n[6]}</p>`}document.querySelectorAll('.node').forEach(el=>el.onclick=()=>{selected=el.dataset.n;apply()});document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{filter=el.dataset.f;apply()});apply()}function render(){app.innerHTML=pages[pos][1]();chapter.textContent=pages[pos][0];count.textContent=String(pos+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0');fill.style.width=((pos+1)/pages.length*100)+'%';prev.disabled=pos===0;next.style.display=pos===pages.length-1?'none':'inline-flex';next.textContent=pos===0?'Começar →':pos===pages.length-2?'Ir para o Desafio ÉTICO →':'Continuar →';hint.textContent=pos===pages.length-1?'Responda ao formulário para concluir a Mini Experiência.':'Uma experiência aberta para conhecer a cultura de integridade do Atlético.';bindPitch();window.scrollTo(0,0)}prev.onclick=()=>{if(pos>0){pos--;render()}};next.onclick=()=>{if(pos<pages.length-1){pos++;render()}};render();
</script></body></html>
